<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>김가경 국어 연구소 · 캡슐 인트로</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Gowun+Batang:wght@400;700&display=swap" />
<style>
  :root{
    --ivory:#F4F3F7; --ivory-dim:#CFCDD8; --muted:#8A889A; --lemon:#C9C3E0;
    --ff:"Pretendard Variable",Pretendard,-apple-system,system-ui,"Malgun Gothic",sans-serif;
    --ff-head:"Gowun Batang","Nanum Myeongjo",serif;
    --ff-script:"Cormorant Garamond",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--ff);color:var(--ivory);overflow-x:hidden;background:#07080A;
  }
  /* 배경: 다크 글로시 + 부드러운 빛줄기 */
  .bg{position:fixed;inset:0;z-index:0;background:
    radial-gradient(1200px 820px at 50% 44%, #18181e 0%, rgba(24,24,30,0) 62%),
    radial-gradient(900px 520px at 80% 16%, rgba(201,195,224,.07) 0%, rgba(201,195,224,0) 60%),
    radial-gradient(900px 700px at 15% 88%, rgba(150,150,180,.045) 0%, rgba(0,0,0,0) 60%),
    #08080b;}
  .bg::after{content:"";position:absolute;inset:0;opacity:.5;
    background:linear-gradient(115deg, transparent 38%, rgba(255,255,255,.05) 46%, transparent 54%),
               linear-gradient(75deg, transparent 60%, rgba(255,255,255,.035) 68%, transparent 74%);
    filter:blur(2px)}

  #c{position:fixed;top:0;left:0;z-index:1;display:block}

  .scroller{position:relative;z-index:2;height:360vh;pointer-events:none}

  /* 상단바 */
  .topnav{position:fixed;inset:0 0 auto 0;z-index:40;display:flex;align-items:center;justify-content:space-between;
    padding:18px 22px calc(18px + env(safe-area-inset-top));pointer-events:none}
  .brandmark{font-family:var(--ff-head);font-weight:700;font-size:16px;letter-spacing:-.02em;color:var(--ivory);
    opacity:.0;transition:opacity .4s}
  .brandmark b{color:var(--lemon)}
  .skip{pointer-events:auto;font-family:var(--ff);font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;
    border:1px solid rgba(255,255,255,.14);padding:8px 15px;border-radius:999px;backdrop-filter:blur(8px)}
  .skip:hover{color:var(--ivory)}

  .copy{position:fixed;left:0;right:0;z-index:20;text-align:center;pointer-events:none;padding:0 22px}
  .copy-intro{top:12%}
  .script{font-family:var(--ff-script);font-style:italic;font-size:clamp(20px,3vw,30px);color:var(--lemon)}
  .headline{font-family:var(--ff-head);font-weight:700;font-size:clamp(30px,5.6vw,54px);letter-spacing:-.03em;line-height:1.18;margin-top:6px}
  .sub{font-family:var(--ff-head);font-size:clamp(13px,2.1vw,16px);color:var(--ivory-dim);margin-top:13px;line-height:1.6}
  .copy-outro{top:14%;opacity:0}
  .copy-outro .brand{font-family:var(--ff-head);font-weight:700;font-size:clamp(26px,5vw,46px);letter-spacing:-.03em}
  .copy-outro .brand b{color:var(--lemon)}
  .copy-outro .brand-sub{font-size:14px;color:var(--ivory-dim);margin-top:10px}
  .enter{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;margin-top:22px;
    font-family:var(--ff);font-size:15px;font-weight:700;color:#0C0D0A;background:var(--lemon);border:0;border-radius:999px;
    padding:14px 26px;cursor:pointer;text-decoration:none;box-shadow:0 12px 34px rgba(201,195,224,.22);transition:transform .15s,background .2s}
  .enter:hover{transform:translateY(-2px);background:#dcd6f0}

  .cue{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:30;font-size:13.5px;color:var(--ivory-dim);
    display:flex;flex-direction:column;align-items:center;gap:9px;transition:opacity .3s;pointer-events:none}
  .cue .cuetxt{text-align:center;line-height:1.45;font-weight:600;letter-spacing:-.01em}
  .cue .mouse{width:24px;height:38px;border:1.6px solid rgba(255,255,255,.45);border-radius:13px;position:relative}
  .cue .mouse::after{content:"";position:absolute;left:50%;top:8px;width:3.5px;height:7px;border-radius:2px;background:var(--lemon);
    transform:translateX(-50%);animation:wheel 1.5s ease-in-out infinite}
  .cue .chev{width:11px;height:11px;border-right:2.2px solid var(--lemon);border-bottom:2.2px solid var(--lemon);animation:chevbob 1.5s ease-in-out infinite}
  @keyframes wheel{0%{opacity:0;transform:translate(-50%,0)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,12px)}}
  @keyframes chevbob{0%,100%{transform:rotate(45deg) translateY(0);opacity:.45}50%{transform:rotate(45deg) translateY(4px);opacity:1}}

  .tip{position:fixed;z-index:35;pointer-events:none;background:rgba(10,11,8,.88);border:1px solid rgba(236,248,90,.3);
    color:var(--ivory);font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:9px;max-width:240px;
    opacity:0;transform:translateY(4px);transition:opacity .15s;backdrop-filter:blur(6px)}

  .loading{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#07080A;color:var(--muted);
    font-size:13px;letter-spacing:.1em;transition:opacity .6s}
  .loading.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
  <div class="bg"></div>
  <canvas id="c"></canvas>

  <nav class="topnav">
    <div class="brandmark" id="brandmark">김가경 국어 연구소<b>.</b></div>
    <a class="skip" href="home.html">건너뛰기 →</a>
  </nav>

  <div class="copy copy-intro" id="introCopy">
    <div class="script">오래 간직할,</div>
    <h1 class="headline">국어의 모든 순간</h1>
    <p class="sub">수업과 영상, 기록을 캡슐에 모았습니다. &nbsp;구슬을 누르면 영상으로.</p>
  </div>

  <div class="copy copy-outro" id="outroCopy">
    <div class="brand">김가경 국어 연구소<b>.</b></div>
    <div class="brand-sub">읽는 힘이 쌓이는 곳</div>
    <a class="enter" href="home.html">연구소 들어가기 →</a>
  </div>

  <div class="cue" id="cue"><span class="cuetxt">아래로 스크롤하면<br/>캡슐이 열립니다</span><div class="mouse"></div><div class="chev"></div></div>
  <div class="tip" id="tip"></div>
  <div class="scroller"></div>
  <div class="loading" id="loading">불러오는 중…</div>

  <script src="videos.js"></script>
  <script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }}
  </script>
  <script type="module">
  import * as THREE from 'three';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

  const VIDEOS = (window.KGK_VIDEOS || []).slice(0, 12);
  const canvas = document.getElementById('c');
  const tip = document.getElementById('tip');
  const introCopy = document.getElementById('introCopy');
  const outroCopy = document.getElementById('outroCopy');
  const brandmark = document.getElementById('brandmark');
  const cue = document.getElementById('cue');

  // 안정적 레이아웃용 시드 RNG
  let seed = 20261004;
  function rnd(){ seed = (seed*1664525 + 1013904223) & 0xffffffff; return (seed>>>0)/4294967296; }
  const lerp=(a,b,t)=>a+(b-a)*t;
  const easeInOut=t=> t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

  const isMobile = window.matchMedia('(pointer:coarse)').matches || (window.innerWidth > 0 && window.innerWidth < 640);
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
  camera.position.set(0, 0, 9);

  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.045).texture;

  scene.add(new THREE.AmbientLight(0xffffff, 0.28));
  const key = new THREE.DirectionalLight(0xffffff, 1.0); key.position.set(-5.5,6.5,6.5); scene.add(key);
  const rim = new THREE.DirectionalLight(0xc6c0e6, 0.55); rim.position.set(-6,-2,-5); scene.add(rim);

  // ── 캡슐 ──
  const capsule = new THREE.Group(); scene.add(capsule);
  const R = 1.18, L = 2.5;
  const glassMat = new THREE.MeshPhysicalMaterial({ color:0xffffff, metalness:0, roughness:0.12, transmission:1, thickness:1.6, ior:1.42, clearcoat:1, clearcoatRoughness:0.12, transparent:true, attenuationColor:new THREE.Color(0xf1f0fa), attenuationDistance:5.0, envMapIntensity:1.25 });
  const vessel = new THREE.Mesh(new THREE.CapsuleGeometry(R, L, 18, 48), glassMat);
  vessel.rotation.z = Math.PI/2; capsule.add(vessel);
  const bodyMat = glassMat, bodyMax = 1;
  // 라벤더 캡(좌측, 불투명)
  const lemonMat = new THREE.MeshPhysicalMaterial({color:0xc6bfe6, metalness:0, roughness:0.32, clearcoat:1, clearcoatRoughness:0.28, envMapIntensity:1.0});
  const capLen = 0.78, leftX = -L/2;
  const capCyl = new THREE.Mesh(new THREE.CylinderGeometry(R*1.012, R*1.012, capLen, 48), lemonMat);
  capCyl.rotation.z = Math.PI/2; capCyl.position.x = leftX + capLen/2; capsule.add(capCyl);
  const capEnd = new THREE.Mesh(new THREE.SphereGeometry(R*1.012, 48, 28), lemonMat);
  capEnd.position.x = leftX; capsule.add(capEnd);
  capsule.rotation.set(0.30, -0.52, 0.10);

  // ── 구슬 ──
  const loader = new THREE.TextureLoader();
  // 유리 광택 오버레이 텍스처(선명 유지용 2D 빌보드)
  function makeGlassTex(){
    const c=document.createElement('canvas'); c.width=c.height=256; const x=c.getContext('2d');
    let rim=x.createRadialGradient(128,128,78,128,128,128);
    rim.addColorStop(0,'rgba(255,255,255,0)'); rim.addColorStop(0.80,'rgba(255,255,255,0)');
    rim.addColorStop(0.93,'rgba(255,255,255,0.4)'); rim.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=rim; x.fillRect(0,0,256,256);
    let sheen=x.createRadialGradient(100,92,6,128,128,128);
    sheen.addColorStop(0,'rgba(255,255,255,0.10)'); sheen.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=sheen; x.fillRect(0,0,256,256);
    x.save(); x.translate(94,84); x.rotate(-0.5);
    let hi=x.createRadialGradient(0,0,2,0,0,52); hi.addColorStop(0,'rgba(255,255,255,0.95)'); hi.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=hi; x.beginPath(); x.ellipse(0,0,50,30,0,0,7); x.fill(); x.restore();
    const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
  }
  const glassTex = makeGlassTex();
  const orbs = [];
  const bodyX0 = leftX + capLen + 0.34, bodyX1 = L/2 - 0.1;
  VIDEOS.forEach((v, i)=>{
    const r = 0.32 + rnd()*0.16;
    const g = new THREE.Group();
    const crop = { rx: v.repeatX || 0.3375, ry: v.repeatY || 0.6, ox: (v.offX!=null?v.offX:0.33), oy: (v.offY!=null?v.offY:0.2) };
    const tex = loader.load('assets/thumbs/'+v.id+'.jpg');
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.center.set(0,0);
    tex.repeat.set(crop.rx, crop.ry);
    tex.offset.set(crop.ox, crop.oy);
    const innerMat = new THREE.MeshBasicMaterial({map:tex}); innerMat.toneMapped = false;
    const inner = new THREE.Mesh(new THREE.CircleGeometry(r*0.92, 48), innerMat); // 선명한 얼굴 원판(빌보드)
    const glass = new THREE.Mesh(new THREE.PlaneGeometry(r*2.08, r*2.08),
      new THREE.MeshBasicMaterial({map:glassTex, transparent:true, depthWrite:false, toneMapped:false})); // 유리 광택 오버레이
    glass.position.z = 0.001;
    glass.userData.orbIndex = i;
    g.add(inner); g.add(glass);
    // 가운데 한 뭉치로 모여 둥둥(레퍼런스: 중앙 클러스터, 화면 넓어도 중앙 고정)
    const gAng = i * 2.39996; // 황금각 → 가운데부터 채워 뭉침(i=0 중앙)
    const gRad = 0.5 * Math.sqrt(i);
    const scatter = new THREE.Vector3(
      Math.cos(gAng)*gRad*1.55 + (rnd()-0.5)*0.16,
      Math.sin(gAng)*gRad*1.18 + (rnd()-0.5)*0.16,
      (rnd()*2-1)*0.6
    );
    // 캡슐 내부 목표(local)
    const tx = lerp(bodyX0, bodyX1, rnd());
    const rr = (R - r - 0.08) * Math.sqrt(rnd());
    const ang = rnd()*Math.PI*2;
    const target = new THREE.Vector3(tx, Math.cos(ang)*rr, Math.sin(ang)*rr);
    g.position.copy(scatter);
    g.userData = { v, r, scatter, target, phase: rnd()*Math.PI*2, inner, thumbTex: tex, crop, video:null, vtex:null };
    scene.add(g);
    orbs.push(g);
  });

  // ── 인터랙션(클릭/호버) ──
  const ray = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  let hover = null, pxy = {x:0,y:0};
  const glassMeshes = ()=> orbs.map(o=>o.children[1]);
  function pick(ev){
    const rect = canvas.getBoundingClientRect();
    pointer.x = ((ev.clientX-rect.left)/rect.width)*2-1;
    pointer.y = -((ev.clientY-rect.top)/rect.height)*2+1;
    pxy.x = ev.clientX; pxy.y = ev.clientY;
    ray.setFromCamera(pointer, camera);
    const hit = ray.intersectObjects(glassMeshes(), false)[0];
    return hit ? orbs[hit.object.userData.orbIndex] : null;
  }
  let lastHover = null;
  function playOrb(o){ const d=o.userData; if(!d.video){ const vid=document.createElement('video'); vid.src='assets/clips/'+d.v.id+'.mp4'; vid.muted=true; vid.loop=true; vid.playsInline=true; vid.preload='auto'; vid.onerror=()=>{ d.inner.material.map=d.thumbTex; d.inner.material.needsUpdate=true; }; d.video=vid; const vt=new THREE.VideoTexture(vid); vt.colorSpace=THREE.SRGBColorSpace; vt.wrapS=vt.wrapT=THREE.ClampToEdgeWrapping; vt.center.set(0,0); vt.repeat.set(d.crop.rx,d.crop.ry); vt.offset.set(d.crop.ox,d.crop.oy); d.vtex=vt; } try{d.video.currentTime=0;}catch(_){} const pr=d.video.play(); if(pr&&pr.catch)pr.catch(()=>{}); if(d.vtex){ d.inner.material.map=d.vtex; d.inner.material.needsUpdate=true; } }
  function stopOrb(o){ const d=o.userData; if(d.video)d.video.pause(); d.inner.material.map=d.thumbTex; d.inner.material.needsUpdate=true; }
  window.addEventListener('pointermove', (e)=>{
    hover = pick(e);
    if(!isMobile && hover!==lastHover){ if(lastHover) stopOrb(lastHover); if(hover) playOrb(hover); lastHover=hover; }
    canvas.style.cursor = hover ? 'pointer' : 'default';
    if(hover){ tip.textContent = hover.userData.v.title || '영상 보기';
      tip.style.left = Math.min(window.innerWidth-250, pxy.x+14)+'px';
      tip.style.top = (pxy.y+16)+'px'; tip.style.opacity = 1; tip.style.transform='translateY(0)';
    } else { tip.style.opacity = 0; }
  }, {passive:true});
  window.addEventListener('click', (e)=>{ const o = pick(e); if(o && o.userData.v.url) window.open(o.userData.v.url, '_blank', 'noopener'); });

  // ── 스크롤 진행 ──
  let prog = 0;
  function onScroll(){
    const max = document.querySelector('.scroller').offsetHeight - window.innerHeight;
    prog = max>0 ? Math.min(1, Math.max(0, window.scrollY/max)) : 0;
  }
  window.addEventListener('scroll', onScroll, {passive:true});

  function resize(){
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w,h); camera.aspect = w/h; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', ()=>{ resize(); onScroll(); });
  resize(); onScroll();

  // 로딩 종료
  let shown=false;
  function hideLoading(){ if(shown) return; shown=true; const l=document.getElementById('loading'); l.classList.add('hide'); setTimeout(()=>l.remove(),700); }
  setTimeout(hideLoading, 1200);

  const clock = new THREE.Clock();
  const tmpT = new THREE.Vector3();
  function animate(){
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    const e = easeInOut(Math.min(1, prog/0.9));

    // 캡슐/카메라 먼저 갱신(구슬 목표 계산에 쓰임)
    const bodyA = Math.min(1, Math.max(0,(prog-0.06)/0.4));
    bodyMat.opacity = bodyA * bodyMax;
    lemonMat.opacity = bodyA; lemonMat.transparent = true;
    capsule.scale.setScalar(lerp(1.0, 0.82, e));
    capsule.rotation.y = -0.42 + Math.sin(t*0.22)*0.05 + prog*0.18;
    capsule.rotation.x = 0.24 + prog*0.03;
    const fitMul = Math.min(3.0, Math.max(1, 1.42/camera.aspect)); // 세로/좁은 화면에서 전체가 보이게 뒤로
    camera.position.z = lerp(9.6, 8.7, e) * fitMul;
    camera.position.y = 0;
    camera.lookAt(0, 0, 0);
    capsule.updateMatrixWorld(true);
    camera.updateMatrixWorld();

    const capS = capsule.scale.x;
    orbs.forEach((o)=>{
      const d = o.userData;
      tmpT.copy(d.target); capsule.localToWorld(tmpT);   // 캡슐 내부 목표(월드·회전/스케일 반영)
      const p = d.scatter.clone().lerp(tmpT, e);          // 흩어진 위치는 월드=화면 균형(캡슐 회전 영향 없음)
      const fl = (1-e);
      p.x += Math.sin(t*0.6 + d.phase)*0.12*fl;
      p.y += Math.cos(t*0.5 + d.phase)*0.12*fl;
      p.z += Math.sin(t*0.4 + d.phase*1.3)*0.10*fl;
      o.position.copy(p);
      const sc = lerp(1, 0.82, e) * capS * (hover===o ? 1.12 : 1);
      o.scale.setScalar(lerp(o.scale.x||1, sc, 0.2));
      o.quaternion.copy(camera.quaternion); // 구슬 정면 고정(빌보드)
    });

    // 텍스트 전환
    const io = Math.max(0, 1 - prog/0.42);
    introCopy.style.opacity = io; introCopy.style.transform = `translateY(${-prog*42}px)`;
    const oo = Math.min(1, Math.max(0,(prog-0.8)/0.18));
    outroCopy.style.opacity = oo; outroCopy.style.transform = `translateY(${(1-oo)*18}px)`;
    brandmark.style.opacity = Math.min(0.9, Math.max(0,(prog-0.3)/0.3));
    cue.style.opacity = Math.max(0, 1 - prog/0.07);

    renderer.render(scene, camera);
    hideLoading();
  }
  animate();
  </script>
</body>
</html>
